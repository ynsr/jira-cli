[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-cli"
version = "2.0.0"
description = "Query, list, and interact with Jira issues from the terminal"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Yns", email = "yoonesr@gmail.com"}]

[project.scripts]
jira-cli = "jira_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
