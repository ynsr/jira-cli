[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-cli"
version = "2.0.0"
description = "Query, list, and interact with Jira issues from the terminal"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Yns", email = "yoonesr@gmail.com"}]
dependencies = [
    "cryptography>=41",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
jira-cli = "jira_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src/jira_cli --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
relative_files = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "sys.exit",
    "raise NotImplementedError",
]
